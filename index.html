<!DOCTYPE html>
<html lang="es" data-tema="agua">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dale wacha activá</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎟️</text></svg>">
<script>
  // Pinta el tema guardado antes de mostrar nada, para que no parpadee.
  try { var t = JSON.parse(localStorage.getItem('pacto-tema') || 'null');
    if (t) { document.documentElement.dataset.tema = t.tema || 'agua'; if (t.apariencia === 'light' || t.apariencia === 'dark') document.documentElement.dataset.theme = t.apariencia; } } catch(e){}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<div id="app">
  <header class="barra"><span class="marca" id="marca">Dale wacha activá</span><button class="yo" id="yo" hidden aria-label="Tu perfil"></button></header>
  <main id="vista"><p class="cargando">Cargando…</p></main>
</div>

<nav class="tabs" id="tabs" hidden>
  <button data-tab="semana"><span aria-hidden="true">🎟️</span>Mi semana</button>
  <button data-tab="muro"><span aria-hidden="true">📸</span>Muro</button>
  <button data-tab="grupo"><span aria-hidden="true">⭐</span>Grupo</button>
  <button data-tab="reglas"><span aria-hidden="true">🎲</span>Reglas</button>
</nav>

<!-- Registrar actividad -->
<dialog id="dlg" aria-labelledby="dlg-t">
  <form id="f-act" class="hoja" novalidate>
    <div class="hoja-top">
      <h2 id="dlg-t">Registrar actividad</h2>
      <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">✕</button>
    </div>
    <fieldset style="margin-top:16px">
      <legend>¿Qué hiciste?</legend>
      <div class="chips" id="chips"></div>
    </fieldset>
    <label class="check" style="margin-top:18px" id="lbl-grupal"><input type="checkbox" id="grupal"> Fue una actividad grupal ⭐</label>
    <div id="con-quien" hidden>
      <p class="leyenda">¿Con quién?</p>
      <div class="chips" id="chips-quien"></div>
      <div id="hint"></div>
    </div>
    <div class="fila">
      <label>Minutos<input type="number" name="minutos" inputmode="numeric" min="1" max="600" step="5" value="30"></label>
      <label>Día<select name="fecha" id="sel-fecha"></select></label>
    </div>
    <p class="ayuda" id="ayuda-min"></p>
    <label>Nota <span class="ayuda">(opcional)</span><textarea name="nota" rows="2" maxlength="200" placeholder="Ej: funcional con Mica, morí"></textarea></label>
    <button type="button" class="btn" id="btn-foto">📸 Sacar la foto y sellar</button>
    <input type="file" accept="image/*" id="in-foto-act" class="oculto" tabindex="-1" aria-hidden="true">
    <p class="estado-dlg" id="estado-dlg" role="status" aria-live="polite"></p>
    <p class="ayuda" style="text-align:center">Sin foto no cuenta. Se registra apenas elegís la foto.</p>
  </form>
</dialog>

<!-- Perfil -->
<dialog id="perfil" aria-labelledby="perfil-t">
  <div class="hoja">
    <div class="hoja-top">
      <h2 id="perfil-t">Tu perfil</h2>
      <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">✕</button>
    </div>
    <div id="perfil-cuerpo"></div>
    <p class="guardado" id="perfil-guardado" aria-live="polite"></p>
  </div>
</dialog>

<dialog id="visor" aria-label="Foto"><img alt=""></dialog>
<input type="file" accept="image/*" id="in-foto" class="oculto" tabindex="-1" aria-hidden="true">
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="comun.js"></script>
<script src="app.js"></script>
</body>
</html>
